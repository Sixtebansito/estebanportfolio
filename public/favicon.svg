<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#22c55e" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="3" stroke-opacity="0.4" />

  <!-- Monogram "E" -->
  <path d="M42 36 h44 c2.5 0 4.5 2 4.5 4.5 s-2 4.5 -4.5 4.5 H52 v18 h28 c2.5 0 4.5 2 4.5 4.5 s-2 4.5 -4.5 4.5 H52 v18 h35 c2.5 0 4.5 2 4.5 4.5 s-2 4.5 -4.5 4.5 H42 c-2.5 0 -4.5 -2 -4.5 -4.5 V40.5 c0 -2.5 2 -4.5 4.5 -4.5 Z" fill="#FFFFFF" />

  <!-- Glint Green Dot "." with Glow -->
  <circle cx="98" cy="94" r="7" fill="url(#greenGrad)" filter="url(#glow)" />
</svg>
